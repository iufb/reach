<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" width="108" height="108">
  <!-- Animation A1 "cut" (ADR-0012): first frame of the splash animation.
       gap = shape that fills the cut so the mark starts as one solid R.
       It is clipped by the rect "sweep"; the rect slides +45 units along X
       (440 ms, delay 300 ms, cubic-bezier(.65,0,.25,1)) and opens the cut left to right.
       At rest the sweep is fully moved out, so the gap is invisible. -->
  <defs>
    <clipPath id="sweep-clip"><rect id="sweep" x="35" y="30" width="45" height="45"/></clipPath>
  </defs>
  <g transform="translate(54 54) scale(1.05) translate(-56.5 -52.5)" fill="#000000">
    <path id="bowl" d="M42 35H60C69 35 75 41 75 47C75 51 73.6 54 71.3 55.9Q69.8 57.2 67.5 57.2Q52.5 57.2 42.5 62Q38 64.2 38 60V39Q38 35 42 35Z"/>
    <path id="hill" d="M43.5 70Q40 70 42.3 68.3Q52 60.4 65 59Q67 58.9 68 60L73.9 68.4Q75.06 70 73 70Z"/>
    <path id="gap" d="M38 56V66Q38 70 42 70L42.3 68.9Q52 61 65 59.6Q67 59.5 68 60.6L68.4 60.6Q67.6 58.6 69.6 56.9L69.4 56.4L67.5 56.6Q52.5 56.6 42.5 61.4Q38.5 63.4 38 59Z" clip-path="url(#sweep-clip)"/>
  </g>
</svg>
