name: API 31 smoke

# Запуск dctest-APK на эмуляторе Android 12 (API 31 = minSdk): ставим, открываем MainActivity,
# падаем, если процесс умер или в logcat есть FATAL EXCEPTION. Отдельно от основного CI — медленно
# (эмулятор). Сборка — только в CI (ADR-0001), про minSdk 31 — ADR-0004.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - app/build.gradle.kts
      - core/td/build.gradle.kts
      - app/src/main/AndroidManifest.xml
      - .github/workflows/api31-smoke.yml
      - scripts/smoke-start.sh

concurrency:
  group: api31-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - run: ./gradlew assembleDctest
        env:
          APP_ID: ${{ secrets.APP_ID }}
          APP_HASH: ${{ secrets.APP_HASH }}

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash scripts/smoke-start.sh

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: api31-smoke
          path: smoke/
          if-no-files-found: ignore
