name: Baseline profile

# APK для снятия baseline profile на устройстве (ADR-0014): приложение без R8 (nonMinifiedReleaseTestdc,
# тот же id и ключ, что у dctest, — вход в test DC сохраняется) и генератор из :baselineprofile.
# Сам профиль снимает scripts/baseline-profile.sh на подключённом телефоне.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - baselineprofile/**
      - .github/workflows/baseline-profile.yml
      - scripts/baseline-profile.sh

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Restore debug keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/debug.keystore"
            echo "DEBUG_KEYSTORE_PATH=$RUNNER_TEMP/debug.keystore" >> "$GITHUB_ENV"
          fi

      - run: ./gradlew :app:assembleNonMinifiedReleaseTestdc :baselineprofile:assembleNonMinifiedReleaseTestdc
        env:
          APP_ID: ${{ secrets.APP_ID }}
          APP_HASH: ${{ secrets.APP_HASH }}

      - if: failure()
        run: ./gradlew :app:tasks --all :baselineprofile:tasks --all | grep -i "assemble" || true

      - uses: actions/upload-artifact@v7
        with:
          name: reach-baseline-profile-apks
          path: |
            app/build/outputs/apk/nonMinifiedReleaseTestdc/*.apk
            baselineprofile/build/outputs/apk/nonMinifiedReleaseTestdc/*.apk
          retention-days: 7
          if-no-files-found: error
