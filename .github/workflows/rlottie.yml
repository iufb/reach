name: rlottie

# Собирает librlottiejni.so (rlottie + lz4 + JNI-мост из native/rlottie) для Android и публикует
# rlottie.zip как GitHub Release. Приложение скачивает его модулем core:rlottie (ADR-0013).
# Обновить rlottie / lz4 или поменять native/rlottie: поправить RLOTTIE_COMMIT / LZ4_COMMIT
# или поднять JNI_VERSION, затем rlottie.release в gradle.properties — тег печатается в сводке.

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/rlottie.yml
      - native/rlottie/**

env:
  RLOTTIE_COMMIT: 25648aef19187b3f87f4d9420b8d761453ad4630 # до 480a2ad (vrle: bound the span count…) — с ним пропадают части фигур, #372
  LZ4_COMMIT: ebb370ca83af193212df4dcbadcc5d87bc0de2f0 # v1.10.0
  JNI_VERSION: 2
  ANDROID_NDK_VERSION: 28.2.13676358
  ABIS: arm64-v8a x86_64

concurrency:
  group: rlottie-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      exists: ${{ steps.tag.outputs.exists }}
    steps:
      - id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="rlottie-${RLOTTIE_COMMIT:0:7}-jni$JNI_VERSION"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Релиз $tag уже есть — сборка пропущена" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check
    if: needs.check.outputs.exists != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$ANDROID_NDK_VERSION" >/dev/null
          echo "NDK=$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION" >> "$GITHUB_ENV"

      - name: Build
        run: |
          for abi in $ABIS; do
            cmake -S native/rlottie -B "build/$abi" -G "Unix Makefiles" \
              -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
              -DANDROID_ABI="$abi" -DANDROID_PLATFORM=android-31 -DANDROID_STL=c++_static \
              -DCMAKE_BUILD_TYPE=Release -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
              -DRLOTTIE_COMMIT="$RLOTTIE_COMMIT" -DLZ4_COMMIT="$LZ4_COMMIT"
            cmake --build "build/$abi" --target rlottiejni -j "$(nproc)"
            mkdir -p "out/rlottie/libs/$abi"
            "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip" --strip-unneeded \
              -o "out/rlottie/libs/$abi/librlottiejni.so" "build/$abi/librlottiejni.so"
          done
          ls -l out/rlottie/libs/*
          (cd out && zip -qr ../rlottie.zip rlottie)

      - uses: actions/upload-artifact@v7
        with:
          name: rlottie
          path: rlottie.zip
          if-no-files-found: error

  release:
    needs: [check, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: rlottie
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.check.outputs.tag }}
        run: |
          gh release create "$TAG" rlottie.zip -R "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$TAG" --latest=false \
            --notes "rlottie [\`$RLOTTIE_COMMIT\`](https://github.com/Samsung/rlottie/commit/$RLOTTIE_COMMIT), lz4 \`$LZ4_COMMIT\`, JNI $JNI_VERSION, ABI: $ABIS, NDK $ANDROID_NDK_VERSION."
          echo "rlottie.release=$TAG" >> "$GITHUB_STEP_SUMMARY"
