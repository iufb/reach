name: Release

# Подписанный release-APK по тегу v* → GitHub Release (docs/adr/0014-release-build.md).
# Секреты: APP_ID, APP_HASH (ADR-0003), FCM_* — продовский Firebase (ADR-0005),
# RELEASE_* — ключ подписи (scripts/release-keystore-wizard.sh).

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Tag matches versionName
        run: |
          version=$(sed -nE 's/^ *versionName = "([^"]+)".*/\1/p' app/build.gradle.kts | head -n1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::тег $GITHUB_REF_NAME не совпадает с versionName $version в app/build.gradle.kts"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Restore release keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "::error::нет секрета RELEASE_KEYSTORE_BASE64 — запустите scripts/release-keystore-wizard.sh"
            exit 1
          fi
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.p12"
          echo "RELEASE_KEYSTORE_PATH=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"

      - run: ./gradlew assembleRelease
        env:
          APP_ID: ${{ secrets.APP_ID }}
          APP_HASH: ${{ secrets.APP_HASH }}
          FCM_PROJECT_ID: ${{ secrets.FCM_PROJECT_ID }}
          FCM_APP_ID: ${{ secrets.FCM_APP_ID }}
          FCM_API_KEY: ${{ secrets.FCM_API_KEY }}
          FCM_SENDER_ID: ${{ secrets.FCM_SENDER_ID }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}

      - name: Verify signature and collect files
        run: |
          apk=$(ls app/build/outputs/apk/release/*.apk | grep -v unsigned | head -n1)
          if [ -z "$apk" ]; then
            echo "::error::нет подписанного APK"; ls -la app/build/outputs/apk/release; exit 1
          fi
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n1)
          "$apksigner" verify --print-certs "$apk" | tee signature.txt
          grep -q "CN=Reach" signature.txt || { echo "::error::APK подписан не release-ключом"; exit 1; }
          mkdir dist
          cp "$apk" "dist/reach-$VERSION.apk"
          cp app/build/outputs/mapping/release/mapping.txt "dist/reach-$VERSION-mapping.txt"

      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "Reach $VERSION" --generate-notes --verify-tag
